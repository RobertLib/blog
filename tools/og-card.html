<!DOCTYPE html>
<!--
  Social card template (1200x630). tools/og-images.js fills in the
  placeholders for every page and screenshots the result with headless
  Chrome into static/. Editing this file marks every card as out of date.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social card</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 700;
        src: url("{{font-url}}") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #111214;
        color: #e9e7e2;
        font-family: "Inter", -apple-system, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Fine engineering grid, barely visible */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            to right,
            rgba(233, 231, 226, 0.035) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(233, 231, 226, 0.035) 1px,
            transparent 1px
          );
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(
          120% 100% at 0% 0%,
          #000 25%,
          transparent 80%
        );
        mask-image: radial-gradient(
          120% 100% at 0% 0%,
          #000 25%,
          transparent 80%
        );
      }

      /* Optional picture on the right, fading into the background */
      .picture {
        position: absolute;
        top: 41px;
        right: 41px;
        bottom: 41px;
        width: 500px;
        overflow: hidden;
        border-radius: 0 3px 3px 0;
        background-image: url("{{image-url}}");
        background-size: cover;
        background-position: center;
      }

      .picture::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          #111214 0%,
          rgba(17, 18, 20, 0.5) 22%,
          rgba(17, 18, 20, 0) 55%
        );
      }

      .no-image .picture {
        display: none;
      }

      /* A picture smaller than the box (a profile photo) is shown at its own
         size as a round portrait, centred where the box would be, instead of
         being blown up and blurred */
      .has-portrait .picture {
        top: calc(315px - var(--portrait) / 2);
        right: calc(291px - var(--portrait) / 2);
        bottom: auto;
        width: var(--portrait);
        height: var(--portrait);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(233, 231, 226, 0.14),
          0 0 0 12px rgba(233, 231, 226, 0.035);
      }

      .has-portrait .picture::after {
        display: none;
      }

      .frame {
        position: absolute;
        z-index: 1;
        inset: 40px;
        border: 1px solid rgba(233, 231, 226, 0.1);
        border-radius: 4px;
      }

      .inner {
        position: absolute;
        inset: 40px;
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .has-image .inner {
        right: 500px;
        padding-right: 8px;
      }

      .has-image .foot {
        flex-direction: column;
        gap: 6px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1.5px solid #e9e7e2;
        border-radius: 9px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
      }

      .brand-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      .eyebrow {
        margin-bottom: 18px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e08a50;
      }

      .eyebrow:empty {
        display: none;
      }

      .headline-box {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        min-height: 0;
        padding-block: 28px;
      }

      .headline {
        font-size: 66px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.08;
        color: #fbfaf8;
        text-wrap: balance;
      }

      .rule {
        width: 72px;
        height: 3px;
        background: #e08a50;
        margin-top: 30px;
        border-radius: 2px;
      }

      .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #827e77;
      }
    </style>
  </head>
  <body class="{{body-class}}" style="--portrait: {{portrait-size}}px">
    <div class="grid"></div>
    <div class="picture"></div>
    <div class="frame"></div>
    <div class="inner">
      <div class="brand">
        <span class="mark">RL</span>
        <span class="brand-name">RobLib&rsquo;s Blog</span>
      </div>

      <div class="headline-box">
        <div class="headline-inner">
          <p class="eyebrow">{{eyebrow}}</p>
          <h1 class="headline">{{title}}</h1>
          <div class="rule"></div>
        </div>
      </div>

      <div class="foot">
        <span>roblibs-blog.com</span>
        <span>Robert Libsansky</span>
      </div>
    </div>
    <script>
      // Shrinks long headlines until they fit their box
      function fit() {
        var box = document.querySelector(".headline-box");
        var inner = document.querySelector(".headline-inner");
        var headline = document.querySelector(".headline");
        var room = box.clientHeight - 56; // minus the vertical padding
        var size = 66;
        while (inner.offsetHeight > room && size > 30) {
          size -= 2;
          headline.style.fontSize = size + "px";
        }
        document.body.setAttribute("data-fitted", size);
      }
      document.fonts.ready.then(fit);
    </script>
  </body>
</html>
