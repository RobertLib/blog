<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive - RobLib's Blog | All Programming Articles</title>
    <meta
      name="description"
      content="Complete archive of all programming and web development articles. Browse through JavaScript, Node.js, frontend development, and software engineering insights."
    />
    <meta
      name="keywords"
      content="programming articles, web development archive, javascript tutorials, nodejs guides, software engineering, coding blog"
    />
    <meta name="author" content="Robert Libsansky" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large"
    />
    <link rel="canonical" href="{{canonical-url}}" />
    <meta
      property="og:title"
      content="Archive - RobLib's Blog | All Programming Articles"
    />
    <meta
      property="og:description"
      content="Complete archive of all programming and web development articles. Browse through topics like JavaScript, Node.js, frontend development, and software engineering insights."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{canonical-url}}" />
    <meta property="og:site_name" content="RobLib's Blog" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="{{base-url}}/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Archive - RobLib's Blog | All Programming Articles"
    />
    <meta
      name="twitter:description"
      content="Complete archive of all programming and web development articles."
    />
    <meta name="twitter:image" content="{{base-url}}/og-image.png" />
    <meta http-equiv="Cache-Control" content="public, max-age=3600" />
    <meta name="generator" content="Blog Generator v1.0.0" />
    <meta
      name="theme-color"
      content="#fbfaf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111214"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/source-serif-4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="feed.xml"
    />
    <script>
      // Applied before first paint so the chosen theme never flashes.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light")
            document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script src="site.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Archive - RobLib's Blog",
        "description": "Complete archive of all programming and web development articles.",
        "url": "{{canonical-url}}",
        "author": {
          "@type": "Person",
          "name": "Robert Libsansky",
          "url": "{{base-url}}"
        },
        "publisher": {
          "@type": "Person",
          "name": "Robert Libsansky"
        },
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "{{canonical-url}}"
        },
        "inLanguage": "en-US"
      }
    </script>
  </head>
  <body class="page-archive">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="wordmark" href="{{base-url}}" aria-label="RobLib's Blog, home">
          <span class="wordmark__mark" aria-hidden="true">RL</span>
          <span class="wordmark__text">RobLib&rsquo;s Blog</span>
        </a>
        <div class="site-header__right">
          <nav class="site-nav" aria-label="Main">
            <a href="{{base-url}}">Home</a>
            <a href="archive.html" aria-current="page">Archive</a>
            <a href="feed.xml">RSS</a>
          </nav>
          <button
            type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-label="Switch theme"
          >
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content">
      <div class="shell">
        <div class="page-head">
          <h1>Archive</h1>
          <p>
            Every article published on the blog &mdash; insights on web
            development, programming, and technology.
          </p>
        </div>
        {{archive}}
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p class="meta">&copy; {{year}} Robert Libsansky</p>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="feed.xml">RSS</a>
          <a href="https://github.com/RobertLib" target="_blank" rel="noopener"
            >GitHub</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
