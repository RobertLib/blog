<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    {{> head-meta}}
    {{> head-assets}}
    {{json-ld}}
  </head>
  <body class="page-home">
    {{> header}}

    <main id="main-content">
      <div class="shell">
        <section class="hero">
          <p class="eyebrow hero__eyebrow">{{author}}</p>
          <h1 class="hero__title">{{t.hero-title}}</h1>
          <p class="hero__text">
            {{t.hero-text}}
          </p>
          <p class="hero__links">
            <a href="{{home}}about.html">{{t.hero-about}}</a>
            <a href="{{home}}projects.html">{{t.hero-projects}}</a>
            <a href="{{home}}feed.xml">RSS</a>
          </p>
        </section>

        {{showcase}}

        <section aria-labelledby="latest-heading">
          <h2 class="section-label" id="latest-heading">{{t.latest}}</h2>
          <div class="post-list">{{articles}}</div>
          {{archive}}
        </section>

        {{subscribe}}
      </div>
    </main>

    {{> footer}}
  </body>
</html>
