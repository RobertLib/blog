    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fbfaf8"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#111214"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <script>
      // Applied before first paint (ahead of the stylesheet, which it would
      // otherwise wait for) so the chosen theme never flashes. The browser
      // UI colour follows the chosen theme rather than the system's.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
            var c = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < c.length; i++) {
              c[i].setAttribute(
                "content",
                t === "dark" ? "#111214" : "#fbfaf8"
              );
              c[i].removeAttribute("media");
            }
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      href="{{root}}fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{root}}fonts/source-serif-4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="{{root}}styles.css" />
    <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="{{root}}favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="{{root}}feed.xml"
    />
    <script src="{{root}}site.js" defer></script>
