    <a href="#main-content" class="skip-link">{{t.skip-link}}</a>

    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="wordmark" href="{{home-url}}">
          <span class="wordmark__mark" aria-hidden="true">RL</span>
          <span class="wordmark__text">{{wordmark-text}}</span>
        </a>
        <div class="site-header__right">
          <nav class="site-nav" aria-label="{{t.nav-label}}">
            <a href="{{home}}archive.html"{{nav-archive-current}}>{{t.nav-archive}}</a>
            <a href="{{home}}projects.html"{{nav-projects-current}}>{{t.nav-projects}}</a>
            <a href="{{home}}about.html"{{nav-about-current}}>{{t.nav-about}}</a>
            <a class="site-nav__rss" href="{{home}}feed.xml">RSS</a>
          </nav>
          {{language-switch}}
          <button
            type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-label="{{t.theme-toggle}}"
            hidden
          >
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>
