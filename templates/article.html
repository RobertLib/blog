<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - RobLib's Blog</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{author}}" />
    <meta name="keywords" content="{{keywords}}" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="canonical" href="{{canonical-url}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{canonical-url}}" />
    <meta property="og:site_name" content="RobLib's Blog" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="{{base-url}}/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RobLib's Blog: Notes on programming and web development"
    />
    <meta property="article:author" content="{{author}}" />
    <meta property="article:published_time" content="{{date}}" />
    <meta property="article:modified_time" content="{{modified-date}}" />
    <meta property="article:section" content="Programming" />
    <meta property="article:tag" content="{{keywords}}" />
    <meta name="generator" content="Blog Generator v1.0.0" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:creator" content="@robertlib" />
    <meta name="twitter:image" content="{{base-url}}/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="RobLib's Blog: Notes on programming and web development"
    />
    {{> head-assets}}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{json-title}}",
        "description": "{{json-description}}",
        "url": "{{canonical-url}}",
        "image": {
          "@type": "ImageObject",
          "url": "{{base-url}}/og-image.png",
          "width": 1200,
          "height": 630
        },
        "datePublished": "{{date}}",
        "dateModified": "{{modified-date}}",
        "author": {
          "@type": "Person",
          "name": "{{json-author}}",
          "url": "{{base-url}}"
        },
        "publisher": {
          "@type": "Person",
          "name": "{{json-author}}"
        },
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "{{canonical-url}}"
        },
        "inLanguage": "en-US",
        "keywords": "{{json-keywords}}",
        "wordCount": {{word-count}},
        "timeRequired": "PT{{reading-time-minutes}}M"
      }
    </script>
  </head>
  <body class="page-post">
    <div class="progress" aria-hidden="true"></div>
    {{> header}}

    <main id="main-content">
      <div class="shell">
        <article class="post">
          <header class="post__header">
            <p class="eyebrow post__meta">
              <time datetime="{{date}}">{{formatted-date}}</time>
              <span class="dot" aria-hidden="true"></span>
              <span>{{reading-time}}</span>
            </p>
            <h1 class="post__title">{{title}}</h1>
            {{lede}}
          </header>

          <div class="prose">{{content}}</div>

          <div class="share">
            <span class="meta share__label">Share</span>
            <a
              class="share__btn"
              href="https://twitter.com/intent/tweet?url={{share-url}}&amp;text={{share-title}}"
              target="_blank"
              rel="noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M13.8 10.6 21.2 2h-1.8l-6.4 7.5L7.9 2H2l7.8 11.4L2 22h1.8l6.8-7.9L16 22h5.9l-8.1-11.4zm-2.4 2.8-.8-1.1L4.4 3.3h2.7l5.1 7.3.8 1.1 6.6 9.4h-2.7l-5.5-7.7z"
                />
              </svg>
              X
            </a>
            <a
              class="share__btn"
              href="https://www.linkedin.com/sharing/share-offsite/?url={{share-url}}"
              target="_blank"
              rel="noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zm1.78 13.02H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
                />
              </svg>
              LinkedIn
            </a>
            <button
              type="button"
              class="share__btn"
              data-copy-link="{{canonical-url}}"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
              </svg>
              <span data-copy-label>Copy link</span>
            </button>
          </div>

          {{related-articles}}
        </article>

        {{navigation}}
      </div>
    </main>

    {{> footer}}
  </body>
</html>
