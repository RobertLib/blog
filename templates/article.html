<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - RobLib's Blog</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Robert Libsansky" />
    <meta name="keywords" content="{{keywords}}" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="canonical" href="{{canonical-url}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{canonical-url}}" />
    <meta property="og:site_name" content="RobLib's Blog" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="{{base-url}}/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="article:author" content="Robert Libsansky" />
    <meta property="article:published_time" content="{{date}}" />
    <meta property="article:section" content="Programming" />
    <meta property="article:tag" content="{{keywords}}" />
    <meta http-equiv="Cache-Control" content="public, max-age=86400" />
    <meta name="generator" content="Blog Generator v1.0.0" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:creator" content="@robertlib" />
    <meta name="twitter:image" content="{{base-url}}/og-image.png" />
    <meta
      name="theme-color"
      content="#fbfaf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111214"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/source-serif-4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="feed.xml"
    />
    <script>
      // Applied before first paint so the chosen theme never flashes.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light")
            document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script src="site.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{title}}",
        "description": "{{description}}",
        "url": "{{canonical-url}}",
        "datePublished": "{{date}}",
        "dateModified": "{{date}}",
        "author": {
          "@type": "Person",
          "name": "Robert Libsansky",
          "url": "{{base-url}}"
        },
        "publisher": {
          "@type": "Person",
          "name": "Robert Libsansky"
        },
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "{{canonical-url}}"
        },
        "inLanguage": "en-US",
        "keywords": "{{keywords}}",
        "wordCount": "{{word-count}}",
        "timeRequired": "PT{{reading-time-minutes}}M"
      }
    </script>
  </head>
  <body class="page-post">
    <div class="progress" aria-hidden="true"></div>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="wordmark" href="{{base-url}}" aria-label="RobLib's Blog, home">
          <span class="wordmark__mark" aria-hidden="true">RL</span>
          <span class="wordmark__text">RobLib&rsquo;s Blog</span>
        </a>
        <div class="site-header__right">
          <nav class="site-nav" aria-label="Main">
            <a href="{{base-url}}">Home</a>
            <a href="archive.html">Archive</a>
            <a href="feed.xml">RSS</a>
          </nav>
          <button
            type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-label="Switch theme"
          >
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content">
      <div class="shell">
        <article class="post">
          <header class="post__header">
            <p class="eyebrow post__meta">
              <time datetime="{{date}}">{{formatted-date}}</time>
              <span class="dot" aria-hidden="true"></span>
              <span>{{reading-time}}</span>
            </p>
            <h1 class="post__title">{{title}}</h1>
            {{lede}}
          </header>

          <div class="prose">{{content}}</div>

          <div class="share">
            <span class="meta share__label">Share</span>
            <a
              class="share__btn"
              href="https://twitter.com/intent/tweet?url={{canonical-url}}&amp;text={{title}}"
              target="_blank"
              rel="noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M13.8 10.6 21.2 2h-1.8l-6.4 7.5L7.9 2H2l7.8 11.4L2 22h1.8l6.8-7.9L16 22h5.9l-8.1-11.4zm-2.4 2.8-.8-1.1L4.4 3.3h2.7l5.1 7.3.8 1.1 6.6 9.4h-2.7l-5.5-7.7z"
                />
              </svg>
              X
            </a>
            <a
              class="share__btn"
              href="https://www.linkedin.com/sharing/share-offsite/?url={{canonical-url}}"
              target="_blank"
              rel="noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zm1.78 13.02H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
                />
              </svg>
              LinkedIn
            </a>
            <button
              type="button"
              class="share__btn"
              data-copy-link="{{canonical-url}}"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
              </svg>
              <span data-copy-label>Copy link</span>
            </button>
          </div>

          {{related-articles}}
        </article>

        {{navigation}}
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p class="meta">&copy; {{year}} Robert Libsansky</p>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="feed.xml">RSS</a>
          <a href="https://github.com/RobertLib" target="_blank" rel="noopener"
            >GitHub</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
